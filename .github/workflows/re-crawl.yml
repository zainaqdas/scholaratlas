name: Scholarship data re-crawl

# Keeps the catalogue fresh:
#   - wms deadline refresh (marks records EXPIRED when the source says so)
#   - new wemakescholars listings imported
#   - CUCAS/CSC/DAAD records stay enriched
#
# The heavy Python crawlers (CUCAS detail pages, wms eligibility/nationality,
# DAAD details) are intentionally not run here — they need a stealth browser
# and several hours. Run them manually when a deep refresh is wanted
# (see README "Importing real data").
#
# Required repository secrets:
#   - DATABASE_URL      Turso libsql:// URL (e.g. libsql://<db>-<org>.turso.io)
#   - TURSO_AUTH_TOKEN  Turso token (npx turso db tokens create <db-name>)

on:
  schedule:
    # Weekly: Monday 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch: {} # allow manual trigger

concurrency:
  group: re-crawl
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Prisma client
        run: npx prisma generate

      # 1. Refresh wms deadlines: capture new dates + mark records the source
      #    now lists as "Deadline: Expired". Uses the committed slug list
      #    (data/wms-global-slugs.json) so no listing crawl is needed.
      #
      # Each step is independent (a source being briefly down shouldn't block
      # the rest), but failures are surfaced with continue-on-error so they
      # show up red in the Actions UI instead of being swallowed by `|| true`.
      - name: Refresh wms deadlines
        continue-on-error: true
        run: npm run backfill:wms-deadlines

      # 2. Import new wemakescholars listings (crawl + insert, idempotent).
      - name: Import new wms listings
        continue-on-error: true
        run: npm run import:wms-full

      # 3. Keep China enrichment applied (idempotent backfills). These scripts
      #    use the libSQL adapter (same client as the app), so they run against
      #    the Turso DATABASE_URL — not a local file.
      - name: Refresh CUCAS enrichment
        continue-on-error: true
        run: npm run backfill:cucas-rich
      - name: Refresh CSC enrichment
        continue-on-error: true
        run: npm run backfill:csc-rich
      - name: Refresh field classification
        continue-on-error: true
        run: npm run backfill:fields

      # 4. Report what changed (commit hash for traceability).
      - name: Summary
        run: |
          echo "Re-crawl finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Commit: ${{ github.sha }}"
